# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across diffenrt versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: build test-CICD

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main"]

jobs:
  builds:
    

    runs-on:  ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: install node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-devobs-artifacts
          path: build/